apiVersion: brickkit/v1
kind: Component

metadata:
  id: shell/go-infra
  name: Go 外壳三（infra/integration 基础设施域）
  version: 0.4.7                     # 同 shell/go-core：直接复用 be-shell-go 这个
                                      # git 仓库自己的 tag，三个 Go 外壳实例共用同一份镜像
  description: 把 infra/authz、infra/iam-casdoor、infra/workflow、infra/notification、integration/im-dingtalk 五个 Go 组件合并进一个进程——本身不含任何业务逻辑，纯装配（设计书第 13 章）
  license: Apache-2.0
  vendor: brickKit

tags: [shell, go]

dependencies:
  components: []
  resources:
    - { kind: database, engine: postgresql }
    - { kind: mq,       engine: nats }

configSchema:
  type: object
  properties:
    shellName:
      type: string
    shellConfigJson:                  # → SHELL_CONFIG_JSON，同 shell/go-core 的判据。
                                       # 命令：be-ops shell-config --root . --shell go-infra
      type: string
    shellHealthPort:                  # → SHELL_HEALTH_PORT，值须与下面 deployment.port
                                       # 相同，同 shell/go-core 的判据
      type: string
    otelBaseUrl:
      type: string
      default: ""
    iamJwksUrl:
      type: string
    authzBundleUrl:
      type: string

deployment:
  type: container
  image: brickenterprise/be-shell-go:0.4.7
  port: 8224                         # registry/ports.tsv，_shell-go-infra 行
  labels:                            # 同 shell/go-core：成员自己的 prometheus.io/port
                                      # 已删掉，合并后指标只走外壳这一个共享端口
    prometheus.io/scrape: "true"
    prometheus.io/port: "8224"
    prometheus.io/path: "/metrics"
  resources:
    requests: { cpu: "200m", memory: "256Mi" }   # 五个模块共享一个进程，请求值按合并后
                                                  # 的合理下限给

healthCheck:
  type: http
  path: /healthz
  startPeriodSeconds: 300
